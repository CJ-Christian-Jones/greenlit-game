<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenLit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- ====================================================
       HEADER
  ===================================================== -->
  <header class="site-header">
    <a href="/" class="site-header__logo" aria-label="GreenLit home">
      GREENLIT
    </a>

    <nav class="site-header__nav" aria-label="Main navigation">
      <ul class="site-header__nav-list">
        <li><a href="#" class="site-header__nav-link site-header__nav-link--active">Home</a></li>
        <li><a href="#" class="site-header__nav-link">My Projects</a></li>
        <li><a href="#" class="site-header__nav-link">Genres</a></li>
        <li><a href="#" class="site-header__nav-link">Classics</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <button class="site-header__profile-btn" aria-label="Open profile menu">
        <span class="site-header__profile-avatar" aria-hidden="true">P</span>
      </button>
    </div>
  </header>


  <!-- ====================================================
       MAIN
  ===================================================== -->
  <main>

    <!-- Hero Carousel -->
    <section
      class="hero-carousel"
      aria-label="Featured movies"
      aria-roledescription="carousel"
    >
      <div class="hero-carousel__track" id="heroTrack"></div>

      <button
        class="hero-carousel__arrow hero-carousel__arrow--prev"
        id="heroPrev"
        aria-label="Previous movie"
      >&#8249;</button>

      <button
        class="hero-carousel__arrow hero-carousel__arrow--next"
        id="heroNext"
        aria-label="Next movie"
      >&#8250;</button>

      <ol class="hero-carousel__dots" id="heroDots" aria-label="Slide indicators"></ol>
    </section>


    <!-- Search Section -->
    <section class="search-section" aria-label="Search movies">
      <form class="search-form" id="searchForm" role="search">
        <label for="searchInput" class="sr-only">Search for a movie</label>

        <div class="search-form__bar">
          <input
            type="search"
            id="searchInput"
            class="search-form__input"
            placeholder="Search for a movie…"
            autocomplete="off"
          />
          <button type="submit" class="search-form__submit" aria-label="Search">
            <svg
              class="search-form__icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </div>
      </form>

      <button class="random-movie-btn" id="randomMovieBtn" type="button">
        🎲 Random Movie
      </button>
    </section>


    <!-- Recommendation Rows -->
    <section class="recommendations" aria-label="Movie categories">
      <div id="recommendationContainer"></div>
    </section>

  </main>


  <!-- ====================================================
       FOOTER
  ===================================================== -->
  <footer class="site-footer">
    <p class="site-footer__copy">
      &copy; <span id="footerYear"></span> GreenLit &mdash; Movie data provided by
      <a
        href="https://www.themoviedb.org"
        class="site-footer__link"
        target="_blank"
        rel="noopener"
      >TMDB</a>.
    </p>
  </footer>

  <script src="js/home.js" type="module"></script>
</body>
</html>
